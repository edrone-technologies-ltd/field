<title>הדרכת מנהל תפעול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Secular+One&display=swap">
<style>
/* פריסה: במה = טלפון חי שמריץ את האפליקציה האמיתית, ולידו לוח קריינות עם פרקים, טקסט ובקרות. בטלפון — הטלפון למעלה והקריינות מתחת */
:root{
  --bg:#EEF1E8; --card:#FFFFFF; --ink:#16181C; --muted:#5A6152; --line:#DCE2D2;
  --lime:#C6EA5E; --green:#4F7F00; --green-soft:#E6F2C8; --warn:#A35A00; --bad:#B42318; --ok:#1E7B3A;
  --phone:#0E100C; --shadow:0 30px 60px -28px rgba(22,24,28,.45);
  --display:"Secular One","Heebo",system-ui,sans-serif; --body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11130F; --card:#1B1E18; --ink:#EDF1E5; --muted:#A1A996; --line:#2E3328; --green:#A9D94A; --green-soft:#26301A; --warn:#E3A24B; --bad:#F07A6E; --ok:#6CCB86; --shadow:0 30px 60px -28px rgba(0,0,0,.8); color-scheme:dark }}
:root[data-theme="dark"]{ --bg:#11130F; --card:#1B1E18; --ink:#EDF1E5; --muted:#A1A996; --line:#2E3328; --green:#A9D94A; --green-soft:#26301A; --warn:#E3A24B; --bad:#F07A6E; --ok:#6CCB86; --shadow:0 30px 60px -28px rgba(0,0,0,.8); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;direction:rtl}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:start}
header.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top img{height:34px;width:auto}
header.top .t{display:flex;flex-direction:column}
header.top small{color:var(--muted);font-size:.85rem;letter-spacing:.02em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.15;margin:0;text-wrap:balance}

/* לוח הקריינות */
.panel{display:flex;flex-direction:column;gap:18px;min-width:0;order:1}
.chapters{display:flex;flex-wrap:wrap;gap:8px}
.chapters button{font:inherit;font-size:.86rem;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 13px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chapters button .n{font-variant-numeric:tabular-nums;font-weight:800;color:var(--green)}
.chapters button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chapters button[aria-current="true"] .n{color:var(--lime)}
.chapters button.done:not([aria-current="true"]){color:var(--ink)}
.chapters button:focus-visible,.ctrl button:focus-visible,.choice button:focus-visible,.go:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.say{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.say .eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--green)}
.say h2{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.25;margin:0;text-wrap:balance}
.say p{margin:0;max-width:62ch;color:var(--ink)}
.say .who{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;width:fit-content}
.who.ops{background:var(--green-soft);color:var(--green)} .who.crew{background:#FFF1DB;color:#8A5000}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .who.crew{background:#3A2A12;color:#F2B866}}
:root[data-theme="dark"] .who.crew{background:#3A2A12;color:#F2B866}
.fade{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

.choice{display:flex;flex-direction:column;gap:8px}
.choice .q{font-weight:700}
.choice button{font:inherit;text-align:right;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.choice button .k{font-weight:800;color:var(--green);min-width:1.1em}
.choice button[data-picked="ok"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.choice button[data-picked="no"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.choice button:disabled{cursor:default}
.react{border-radius:14px;padding:12px 14px;font-size:.95rem;line-height:1.55}
.react.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.react.no{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.react b{display:block;margin-bottom:2px}

.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctrl button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.ctrl button.main{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:118px;justify-content:center}
.ctrl .count{margin-inline-start:auto;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;display:flex;gap:3px}
.bar i{flex:1;background:var(--line);position:relative;overflow:hidden;border-radius:99px}
.bar i::after{content:"";position:absolute;inset:0;background:var(--green);transform-origin:right;transform:scaleX(var(--p,0))}

/* הטלפון */
.stage{order:2;display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.phone{width:clamp(250px,30vw,330px);aspect-ratio:390/844;max-width:100%;background:var(--phone);border-radius:46px;padding:11px;box-shadow:var(--shadow);position:relative}
.screen{position:absolute;inset:11px;border-radius:36px;overflow:hidden;background:#F3F5EF}
.screen img.sc{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .5s ease, transform .6s ease;transform:scale(1.015)}
.screen img.sc.on{opacity:1;transform:none}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:34%;height:22px;background:var(--phone);border-radius:99px;z-index:6}
.tag{font-size:.8rem;font-weight:700;color:var(--muted)}
/* מסך מחשב: הטלפון "נפתח" למסך רחב */
.phone{transition:width .6s cubic-bezier(.4,.1,.2,1),border-radius .6s,padding .6s}
.phone.wide{width:clamp(320px,52vw,600px);aspect-ratio:16/10;border-radius:18px;padding:9px}
.phone.wide .screen{inset:9px;border-radius:10px}
.phone.wide .notch{opacity:0}
.notch{transition:opacity .3s}
.ghost{position:absolute;z-index:5;transform:translate(-50%,-50%);background:#E6F2C8;color:#2F4A00;border:2px solid #4F7F00;border-radius:8px;font-size:.62rem;font-weight:800;padding:3px 7px;white-space:nowrap;box-shadow:0 8px 18px rgba(0,0,0,.25);opacity:0;transition:left 1.4s cubic-bezier(.4,.1,.2,1),top 1.4s cubic-bezier(.4,.1,.2,1),opacity .3s;pointer-events:none}
.ghost.show{opacity:1}
.drop{position:absolute;z-index:3;width:9%;height:9%;transform:translate(-50%,-50%);border:3px dashed var(--lime);border-radius:10px;opacity:0;transition:opacity .4s}
.drop.show{opacity:1}
/* אצבע + אדווה */
.finger{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(22,24,28,.28);border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:5;opacity:0;transition:left .9s cubic-bezier(.4,.1,.2,1),top .9s cubic-bezier(.4,.1,.2,1),opacity .3s}
.finger.show{opacity:1}
.finger.tap{animation:press .45s ease}
@keyframes press{50%{transform:scale(.78)}}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--lime);z-index:4;pointer-events:none;animation:rip .8s ease-out forwards}
@keyframes rip{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
.hl{position:absolute;border:3px solid var(--lime);border-radius:16px;box-shadow:0 0 0 9999px rgba(14,16,12,.38);z-index:3;opacity:0;transition:opacity .4s, left .5s, top .5s, width .5s, height .5s}
.hl.show{opacity:1}
/* התראה שקופצת */
.push{position:absolute;top:44px;left:8px;right:8px;z-index:7;background:rgba(250,251,247,.97);color:#16181C;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(-260%);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.3,1.2),opacity .3s}
.push.show{transform:none;opacity:1}
.push img{width:30px;height:30px;border-radius:8px;flex:none;background:#C6EA5E;object-fit:contain}
.push b{display:block;font-size:.8rem} .push small{display:block;font-size:.76rem;line-height:1.35;color:#3D4237}
.push .app{font-size:.66rem;color:#6B7163;font-weight:700;letter-spacing:.03em}
.toast{position:absolute;left:50%;bottom:9%;transform:translate(-50%,20px);z-index:7;background:#16181C;color:#fff;font-size:.8rem;font-weight:700;padding:8px 14px;border-radius:12px;opacity:0;transition:.4s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* כרטיס פתיחה/סיום בתוך המסך */
.splash{position:absolute;inset:0;z-index:2;background:#16181C;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;opacity:0;transition:opacity .5s}
.splash.on{opacity:1}
.splash img{width:62%;background:#fff;border-radius:16px;padding:10px 14px}
.splash b{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.3}
.splash small{color:#C6EA5E;font-weight:700}
.days{display:flex;flex-direction:column;gap:8px;width:100%}
.days div{background:#22261E;border-radius:12px;padding:8px 10px;text-align:right;font-size:.82rem}
.days div span{color:#C6EA5E;font-weight:800;margin-left:6px}

.go{font:inherit;font-weight:800;font-size:1.05rem;border:0;background:var(--lime);color:#16181C;border-radius:16px;padding:14px 22px;cursor:pointer;width:fit-content}
.hint{font-size:.82rem;color:var(--muted)}

/* מחשב נמוך (מצגת): כל הטלפון נכנס במסך בלי גלילה */
@media (min-width:601px){
  .phone{width:min(clamp(250px,30vw,330px),calc((100vh - 200px) * 390 / 844))}
  .phone.wide{width:min(clamp(320px,52vw,600px),calc((100vh - 150px) * 1.6))}
}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:18px}
  .stage{order:1;position:static}
  .panel{order:2}
  .say{min-height:0}
}
/* טלפון: מסך אחד בלי גלילה — פס התקדמות למעלה, המסך באמצע (מותאם לגובה שנשאר), הסבר ובקרות למטה */
@media (max-width:600px){
  html,body{height:100%;overflow:hidden}
  .wrap{display:flex;flex-direction:column;align-items:stretch;height:100vh;height:100dvh;max-width:none;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);gap:8px}
  header.top,.chapters,.hint,.tag{display:none}
  .panel{display:contents}
  .bar{order:1;flex:none;height:4px;margin-inline:0 56px;margin-top:14px}
  .stage{order:2;flex:1 1 0;min-height:220px;position:static;display:flex;justify-content:center;align-items:center}
  .phone{width:200px;height:433px;max-width:100%;padding:5px;border-radius:24px;margin-inline:auto;flex:none}
  .phone.wide{aspect-ratio:auto;padding:4px;border-radius:12px}
  .phone.wide .screen{inset:4px;border-radius:8px}
  .screen{inset:5px;border-radius:19px}
  .notch{display:none}
  .say{order:3;flex:none;min-height:0;max-height:42dvh;overflow:auto;padding:12px 14px;border-radius:18px;gap:6px}
  .say .who{display:none}
  .say .eyebrow{font-size:.72rem}
  .say h2{font-size:1.08rem}
  .say p{font-size:.9rem;line-height:1.5}
  .choice{gap:6px} .choice .q{font-size:.92rem} .choice button{padding:8px 10px;font-size:.86rem;border-radius:12px}
  .react{font-size:.86rem;padding:9px 11px}
  .go{padding:10px 18px;font-size:.95rem}
  .ctrl{order:4;flex:none;gap:8px;flex-wrap:nowrap}
  .ctrl button{padding:9px 12px;border-radius:12px;font-size:.88rem}
  .ctrl button.main{min-width:0;flex:1}
  .ctrl .count{font-size:.78rem}
  .push{top:10px}
}
@media (prefers-reduced-motion: reduce){
  .finger,.screen img.sc,.push,.hl,.toast,.splash{transition:none}
  .fade,.ripple,.finger.tap{animation:none}
}
</style>

<div class="wrap">
  <header class="top">
    <img src="logo.png" alt="E-Drone">
    <div class="t"><h1 id="hello">ברוך הבא לאפליקציית השטח</h1><small>כ-9 דקות · בטלפון ובמחשב · מקרים אמיתיים מהשבוע · אפשר לעצור, לדלג ולחזור</small></div>
  </header>

  <section class="stage" aria-label="מסך הטלפון">
    <span class="tag" id="tag">המסך שלך</span>
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="screen">
        <div class="splash on" id="splash"></div>
        <div class="hl" id="hl"></div>
        <div class="finger" id="finger"></div>
        <div class="push" id="push"><img src="logo.png" alt=""><div><span class="app">E-DRONE שטח · עכשיו</span><b id="pt"></b><small id="pb"></small></div></div>
        <div class="toast" id="toast"></div>
        <div class="ghost" id="ghost"></div><div class="drop" id="drop"></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <nav class="chapters" id="chapters" aria-label="פרקים"></nav>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <article class="say" id="say" aria-live="polite"></article>
    <div class="ctrl">
      <button id="prev" type="button" aria-label="הקודם">→ הקודם</button>
      <button id="play" class="main" type="button">▶ הפעלה</button>
      <button id="next" type="button" aria-label="הבא">הבא ←</button>
      <span class="count" id="count"></span>
    </div>
    <div class="hint">מקשים: רווח = עצירה/הפעלה · חצים = קדימה/אחורה</div>
  </section>
</div>

<script>
// כל סצנה: מסך אמיתי מהאפליקציה, איפה לוחצים (אחוזים מהמסך), מה מודגש, מה אומרים. wide = מסך מחשב. drag = גרירה. לפעמים התראה שקופצת או שאלה "מה היית עושה?"
const CH = ['הכרות', 'לו״ז ושיבוץ', 'הקוסם', 'ניהול יום', 'שולחן ומגדל', 'תכנית עבודה', 'יום בשטח', 'בדיקה לפני עבודה', 'ביקורת ותיקונים', 'התקדמות ולקוח', 'תוקף ותעודות', 'רכש ובקשות', 'השבוע שלך'];
const S = [
  { ch: 0, splash: 'intro', who: 'ops', eb: 'פתיחה', h: 'מה זו האפליקציה', p: 'כל מה שקורה בשטח במקום אחד: הלו״ז, הצוותים, התכניות, הדוחות והתיקונים. אתה מנהל את התפעול מכאן, מהטלפון או מהמחשב. המשרד רואה את אותו מידע ומתעדכן לבד, בלי שתצטרך לשלוח לאף אחד.', dur: 8000 },
  { ch: 0, img: 'o01_home', who: 'ops', eb: 'מסך הבית', h: 'הבית שלך: מה דורש טיפול', p: 'מתחת לכניסה למשמרת מופיע "דורש טיפול": כל מה שמחכה לך, והכי חמור קודם. עכשיו למשל: פרויקט תקוע, 3 עובדים שלא אישרו הגעה למחר, וגלאון שעוד לא מוכן. לחיצה על שורה פותחת את המקום שבו מטפלים. בכרטיס "לאישורך" הכותרת פותחת את העובד או הבקשה, והכפתורים מאשרים ישר מהבית.', hl: [3, 52, 94, 32], tap: [55, 74], dur: 8500 },
  { ch: 0, img: 'o01_home', who: 'ops', eb: 'מסך הבית', h: 'מספרים, שבוע, ו-+', p: 'ארבעה מספרים: בשטח היום, במשמרת, לטיפול ולאישור. מתחתם הצעד הבא, הדבר הכי דחוף בלחיצה אחת, ואז השבוע. כל מספר וכל שורה נפתחים למקור. הכפתור + בסרגל התחתון פותח כל דבר חדש.', hl: [3, 26, 94, 17], tap: [57, 94.5], dur: 7000 },
  { ch: 0, img: 'o20_plus', who: 'ops', eb: 'חדש', h: 'הכל מכפתור אחד', p: 'תקלה, סיכום היום, אפיון, ביקור, החתמת לקוח, הוצאה, רכש, בקשה למשרד וסיכום פרויקט. בכל אחד מהם הפרויקט וההיום כבר ממולאים.', hl: [3, 62, 94, 36], dur: 6500 },
  { ch: 0, img: 'd01_ws', wide: true, who: 'ops', eb: 'במחשב', h: 'במחשב: מערכת ניהול מלאה', p: 'במסך רחב נפתח סרגל צד קבוע עם מונים: שולחן ניהול, מגדל פיקוח, לוח שיבוץ, פרויקטים, ציוד, נוכחות ותוקף. המספר ליד שם המסך אומר כמה מחכים שם.', hl: [84, 8, 15, 80], dur: 7500 },
  { ch: 0, img: 'd02_cmdk', wide: true, who: 'ops', eb: 'במחשב', h: 'Ctrl+K: לכל מקום', p: 'Ctrl+K (או ⌘K) פותח חיפוש מהיר לפרויקט, אדם, אתר או רחפן, או לפעולה כמו "תקלה חדשה". מקלידים שתי אותיות ולוחצים Enter.', hl: [27, 15, 59, 44], dur: 7000 },
