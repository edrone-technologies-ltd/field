<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E1013">
<title>E-Drone · הפרויקט שלכם</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@600;800&display=swap">
<style>
:root{--ink:#16181C;--muted:#6B7280;--line:#E8EAED;--card:#fff;--bg:#F4F5F2;--lime:#C6EA5E;--limed:#4A6B10;--limebg:#EEF7D9;--shadow:0 10px 30px #0000000f}
@media (prefers-color-scheme:dark){:root{--ink:#EEF0F2;--muted:#9AA3AE;--line:#2A2F36;--card:#16191E;--bg:#0E1013;--limed:#C6EA5E;--limebg:#1F2A12;--shadow:none}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.hero{position:relative;min-height:340px;background:#0E1013 center/cover no-repeat;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(20px + env(safe-area-inset-top)) 20px 64px}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#000a 0%,#0000 35%,#000d 100%)}
.hero>*{position:relative;z-index:1}
.top{position:absolute;top:calc(18px + env(safe-area-inset-top));inset-inline:20px;display:flex;justify-content:space-between;align-items:center}
.wm{direction:ltr;font-family:Rubik;font-weight:800;letter-spacing:.18em;font-size:1rem;line-height:1}
.wm small{display:block;font-size:.5rem;letter-spacing:.3em;opacity:.7;font-weight:600;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;background:#0007;backdrop-filter:blur(6px);padding:5px 11px;border-radius:99px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 #C6EA5E99;animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px #C6EA5E00}100%{box-shadow:0 0 0 0 #C6EA5E00}}
.lbl{font-size:.74rem;letter-spacing:.16em;color:var(--lime);font-weight:800}
.hero h1{font-family:Rubik;font-size:2rem;line-height:1.15;margin-top:6px}
.hero p{opacity:.82;margin-top:4px}
main{max-width:640px;margin:-44px auto 0;padding:0 16px 40px;position:relative;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.prog{display:flex;align-items:center;gap:18px}
.ring{--p:0;flex:none;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--lime) calc(var(--p)*1%),var(--line) 0);transition:--p 1s}
.ring b{width:76px;height:76px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:Rubik;font-size:1.45rem;font-weight:800}
.pill{display:inline-block;font-weight:800;font-size:.8rem;padding:3px 11px;border-radius:99px;background:var(--limebg);color:var(--limed)}
.prog h2{font-family:Rubik;font-size:1.25rem;margin-top:6px}
.prog small{color:var(--muted);display:block}
.next{display:flex;align-items:center;gap:14px}
.cal{flex:none;width:62px;border-radius:14px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--card)}
.cal span{display:block;background:var(--lime);color:#16181C;font-size:.7rem;font-weight:800;padding:2px 0}
.cal b{display:block;font-family:Rubik;font-size:1.6rem;line-height:1.3}
.next .k{font-size:.78rem;color:var(--muted);font-weight:700}
.next .v{font-weight:800;font-size:1.08rem}
.next .w{color:var(--muted);font-size:.9rem}
.next .grow{flex:1;min-width:0}
.addcal{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 12px;border-radius:14px;background:var(--limebg);color:var(--limed);text-decoration:none;font-weight:800;font-size:.76rem}
.addcal:active{transform:scale(.96)}
h3{font-family:Rubik;font-size:1.05rem;margin-bottom:10px}
.tl{list-style:none;padding:0;position:relative}
.tl li{position:relative;padding:0 22px 12px 0}
.tl li:before{content:"";position:absolute;right:5px;top:8px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child:before{display:none}
.tl li:after{content:"";position:absolute;right:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--lime)}
.tl li.up:after{background:var(--card);border:2px solid var(--lime);width:8px;height:8px}
.tl b{font-weight:800}.tl span{color:var(--muted);font-size:.92rem;display:block}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal button{position:relative;padding:0;border:0;background:var(--line);border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal:not(.flat) button:first-child{grid-column:span 2;grid-row:span 2}
.tag{position:absolute;top:7px;right:7px;font-size:.66rem;font-weight:800;padding:1px 8px;border-radius:99px;background:#000a;color:#fff}
.tag.a{background:var(--lime);color:#16181C}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.pair figure{position:relative;margin:0;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--line)}
.pair img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.pd{font-size:.82rem;color:var(--muted);font-weight:700;margin:12px 0 6px}
.pd:first-of-type{margin-top:0}
.done{text-align:center;padding:24px 18px}
.tick{width:72px;height:72px;margin:0 auto 10px;border-radius:50%;background:var(--lime);color:#16181C;display:grid;place-items:center;box-shadow:0 0 0 10px var(--limebg)}
.done h2{font-family:Rubik;font-size:1.35rem}
.done p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chips span{background:var(--limebg);color:var(--limed);border-radius:99px;padding:4px 12px;font-size:.86rem;font-weight:700}
.ct{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ct a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:.88rem}
.ct a svg{color:var(--limed)}
.ct a.pri{background:var(--lime);border-color:var(--lime);color:#16181C}.ct a.pri svg{color:#16181C}
.foot{text-align:center;color:var(--muted);font-size:.78rem;margin-top:20px}
.foot b{font-family:Rubik;letter-spacing:.14em;direction:ltr;display:inline-block}
.err{max-width:420px;margin:90px auto;text-align:center;padding:20px}
.err h2{font-family:Rubik;margin-bottom:6px}
.sk{height:340px;background:#0E1013}.sk+main .card{height:120px;opacity:.5}
.zoom{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:9;animation:fade .2s}.zoom img{max-width:96vw;max-height:90vh;border-radius:10px}
@keyframes fade{from{opacity:0}}
.rise{animation:rise .5s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (min-width:700px){.hero{min-height:400px;padding-inline:max(20px,calc(50% - 300px))}.top{inset-inline:max(20px,calc(50% - 300px))}.hero h1{font-size:2.5rem}}
</style>
</head>
<body>
<div id="app"><div class="sk"></div><main><div class="card"></div><div class="card"></div></main></div>
<script>
const t = new URLSearchParams(location.search).get('t') || location.hash.slice(1);
const API = 'https://pshdouedsfaklqdggfst.supabase.co/functions/v1/share';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fd = (d, o = { day: 'numeric', month: 'long' }) => d ? new Date(d + 'T12:00').toLocaleDateString('he-IL', o) : '';
const dow = d => new Date(d + 'T12:00').toLocaleDateString('he-IL', { weekday: 'long' });
const todayIL = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jerusalem' }).format(new Date());
const rel = d => { const n = Math.round((new Date(d + 'T12:00') - new Date(todayIL + 'T12:00')) / 864e5); return n === 0 ? 'היום' : n === 1 ? 'מחר' : n < 7 ? dow(d) : ''; };
const I = { phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2', wa: 'M3 21l1.6-4.8A8.5 8.5 0 1 1 8 19.6z M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z', mail: 'M3 6h18v12H3z M3 7l9 6 9-6', check: 'M5 12.5l4.5 4.5L19 7', cal: 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4 M12 13v5 M9.5 15.5h5' };
const ic = (k, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${I[k]}"/></svg>`;
const tel = p => String(p || '').replace(/[^\d+]/g, ''), wa = p => tel(p).replace(/^0/, '972').replace(/^\+/, '');
const $app = document.getElementById('app');
function render(d) {
  document.title = 'E-Drone · ' + d.name;
  const S = d.signed, pct = d.progress ?? (d.status === 'הושלם' ? 100 : null);
  const c = d.contact || {};
  const nextC = !S && d.next ? `<div class="card next rise"><div class="cal"><span>${esc(fd(d.next.day, { month: 'short' }))}</span><b>${+d.next.day.slice(8)}</b></div>
      <div class="grow"><div class="k">יום העבודה הבא</div><div class="v">${esc(rel(d.next.day) || dow(d.next.day))} · ${esc(fd(d.next.day))}</div>${d.next.from || d.next.work ? `<div class="w">${[d.next.from && `הגעה <bdi dir="ltr">${esc(d.next.from)}</bdi>`, d.next.work && esc(d.next.work)].filter(Boolean).join(' · ')}</div>` : ''}</div>
      <a class="addcal" href="${API}?t=${encodeURIComponent(t)}&ics=1" aria-label="הוספה ליומן">${ic('cal', 20)}<span>ליומן</span></a></div>` : '';
  const doneC = S ? `<div class="card done rise"><div class="tick">${ic('check', 36)}</div><h2>העבודה הושלמה</h2>
      <p>${S.days === 1 ? 'יום עבודה אחד' : S.days + ' ימי עבודה'}${S.range?.[0] ? ` · ${esc(fd(S.range[0]))}${S.range[1] && S.range[1] !== S.range[0] ? ' – ' + esc(fd(S.range[1])) : ''}` : ''}</p>
      <p>אושר ${S.name ? 'ע״י ' + esc(S.name) + ' ' : ''}ב-${esc(fd(S.at.slice(0, 10)))}</p>
      ${S.works?.length ? `<div class="chips">${S.works.slice(0, 10).map(w => `<span>${esc(w)}</span>`).join('')}</div>` : ''}</div>` : '';
  const progC = `<div class="card prog rise"><div class="ring" style="--p:0" id="ring"><b>${pct != null ? pct + '%' : '—'}</b></div>
      <div><span class="pill">${esc(d.status)}</span><h2>${d.days_done ? (d.days_done === 1 ? 'יום עבודה אחד בוצע' : d.days_done + ' ימי עבודה בוצעו') : 'מתכוננים לעבודה'}</h2>
      ${d.tasks_total ? `<small>${d.tasks_done} מתוך ${d.tasks_total} שלבים</small>` : ''}${d.first ? `<small>מ-${esc(fd(d.first))}${d.last && d.last !== d.first ? ` עד ${esc(fd(d.last))}` : ''}</small>` : ''}</div></div>`;
  const ups = (d.plan || []).slice(S ? 0 : 1, 6);
  const tl = (d.days || []).length || ups.length ? `<div class="card rise"><h3>${S ? 'ימי העבודה' : 'לוח העבודה'}</h3><ul class="tl">
      ${(d.days || []).map(x => `<li><b>${esc(fd(x.d))}</b>${x.w ? `<span>${esc(x.w)}</span>` : ''}</li>`).join('')}
      ${S ? '' : ups.map(x => `<li class="up"><b>${esc(fd(x.day))}</b><span>${esc(x.items?.join(' · ') || x.work || 'מתוכנן')}</span></li>`).join('')}</ul></div>` : '';
  const pairsC = S && d.pairs?.length ? `<div class="card rise"><h3>לפני ואחרי</h3>${d.pairs.map(x => `<div class="pd">${esc(fd(x.d))}</div><div class="pair"><figure><img src="${esc(x.b)}" alt="" loading="lazy"><span class="tag">לפני</span></figure><figure><img src="${esc(x.a)}" alt="" loading="lazy"><span class="tag a">אחרי</span></figure></div>`).join('')}</div>` : '';
  const all = d.photos || [], nPh = all.length >= 6 ? Math.min(S ? 9 : 12, 6 + Math.floor((all.length - 6) / 3) * 3) : all.length, ph = all.slice(0, nPh);
  const galC = ph.length && !(S && d.pairs?.length >= 2) ? `<div class="card rise"><h3>${S ? 'תיעוד' : 'מהשטח'}</h3><div class="gal${ph.length < 6 ? ' flat' : ''}">${ph.map(x => `<button type="button" data-z="${esc(x.u)}"><img src="${esc(x.u)}" alt="" loading="lazy">${x.k === 'before' ? '<span class="tag">לפני</span>' : x.k === 'after' ? '<span class="tag a">אחרי</span>' : ''}</button>`).join('')}</div></div>` : '';
  const ctC = c.phone || c.email ? `<div class="card rise"><h3>שאלה? אנחנו כאן</h3><div class="ct">
      ${c.phone ? `<a class="pri" href="tel:${esc(tel(c.phone))}">${ic('phone')}חיוג</a>` : ''}
      ${c.whatsapp ? `<a href="https://wa.me/${esc(wa(c.whatsapp))}?text=${encodeURIComponent('שלום, לגבי הפרויקט ' + d.name)}" target="_blank" rel="noopener">${ic('wa')}וואטסאפ</a>` : ''}
      ${c.email ? `<a href="mailto:${esc(c.email)}?subject=${encodeURIComponent(d.name)}">${ic('mail')}מייל</a>` : ''}</div></div>` : '';
  $app.innerHTML = `
    <div class="hero" style="${d.cover ? `background-image:url('${esc(d.cover)}')` : ''}"><div class="top"><div class="wm">E-DRONE<small>TECHNOLOGIES</small></div>${S ? '' : '<span class="live"><i></i>עדכון חי</span>'}</div>
      <div class="lbl">${S ? 'דוח סיום פרויקט' : 'התקדמות הפרויקט'}</div><h1>${esc(d.name)}</h1><p>${esc(d.client || d.address || '')}</p></div>
    <main>${S ? doneC + pairsC + galC + tl : progC + nextC + galC + tl}${ctC}
      <div class="foot"><bdi dir="ltr"><b>E-DRONE</b> Technologies</bdi> · עודכן ${new Date(d.updated).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
    </main>`;
  requestAnimationFrame(() => { const r = document.getElementById('ring'); if (r && pct != null) { let v = 0; const st = () => { v = Math.min(pct, v + Math.max(1, pct / 30)); r.style.setProperty('--p', v); if (v < pct) requestAnimationFrame(st); }; st(); } });
  document.querySelectorAll('[data-z], .pair img').forEach(b => b.onclick = () => { const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${esc(b.dataset.z || b.src)}" alt="">`; z.onclick = () => z.remove(); document.body.appendChild(z); });
}
const load = () => fetch(API + '?t=' + encodeURIComponent(t)).then(r => r.json()).then(d => {
  if (d.error) { $app.innerHTML = `<div class="err"><h2>${esc(d.error)}</h2><p>לקבלת קישור חדש פנו ל-E-Drone.</p></div>`; return; }
  render(d);
}).catch(() => { if (!document.querySelector('.hero')) $app.innerHTML = '<div class="err"><h2>אין חיבור</h2><p>נסו שוב בעוד רגע.</p></div>'; });
load();
// חי: מתעדכן לבד כשחוזרים ללשונית
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
