<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>E-Drone · התקדמות הפרויקט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Rubik:wght@600;800&display=swap">
<style>
:root{--ink:#16181C;--muted:#6B7280;--line:#E8EAED;--lime:#C6EA5E;--limed:#4A6B10;--bg:#F6F7F5}
*{box-sizing:border-box;margin:0}
body{font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.hero{position:relative;height:300px;background:#0E1013 center/cover no-repeat;color:#fff}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0009 0%,#0000 40%,#000c 100%)}
.top{position:absolute;top:18px;inset-inline:20px;z-index:1;display:flex;justify-content:space-between;align-items:center}
.wm{direction:ltr;font-family:Rubik;font-weight:800;letter-spacing:.16em;font-size:1rem}
.wm small{display:block;font-size:.55rem;letter-spacing:.24em;opacity:.65;font-weight:600}
.kick{font-size:.68rem;letter-spacing:.28em;color:var(--lime);font-weight:700;direction:ltr}
.ht{position:absolute;bottom:20px;inset-inline:20px;z-index:1}
.ht .lbl{font-size:.75rem;letter-spacing:.2em;color:var(--lime);font-weight:700}
.ht h1{font-family:Rubik;font-size:1.7rem;line-height:1.2;margin-top:6px}
.ht p{opacity:.8;margin-top:4px}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.status{display:inline-block;font-weight:800;font-size:.85rem;padding:4px 12px;border-radius:99px;background:#EEF7D9;color:var(--limed)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:14px}
.kpis b{display:block;font-family:Rubik;font-size:1.6rem} .kpis span{font-size:.8rem;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:var(--lime)}
h2{font-family:Rubik;font-size:1.15rem;margin-bottom:10px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in;background:#eee}
.up{display:flex;flex-wrap:wrap;gap:8px}.up span{background:#F3F8E6;color:var(--limed);font-weight:700;border-radius:10px;padding:6px 12px;font-size:.9rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
.err{max-width:420px;margin:80px auto;text-align:center;padding:20px}
.zoom{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:9}.zoom img{max-width:96vw;max-height:92vh;border-radius:8px}
</style>
</head>
<body>
<div id="app"><div class="err">טוען…</div></div>
<script>
const t = new URLSearchParams(location.search).get('t') || location.hash.slice(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fd = d => d ? new Date(d + 'T12:00').toLocaleDateString('he-IL', { day: 'numeric', month: 'long' }) : '';
fetch('https://pshdouedsfaklqdggfst.supabase.co/functions/v1/share?t=' + encodeURIComponent(t)).then(r => r.json()).then(d => {
  if (d.error) { document.getElementById('app').innerHTML = `<div class="err"><h2>${esc(d.error)}</h2><p>לקבלת קישור חדש פנו ל-E-Drone.</p></div>`; return; }
  document.title = 'E-Drone · ' + d.name;
  document.getElementById('app').innerHTML = `
    <div class="hero" style="background-image:url('${esc(d.cover || '')}')"><div class="top"><div class="wm">E-DRONE<small>TECHNOLOGIES</small></div><div class="kick">PROJECT PROGRESS</div></div>
      <div class="ht"><div class="lbl">התקדמות הפרויקט</div><h1>${esc(d.name)}</h1><p>${esc(d.client || d.site || '')}</p></div></div>
    <main>
      <div class="card"><span class="status">${esc(d.status)}</span>${d.signed ? ' <span class="status">אושר ע״י הלקוח</span>' : ''}
        <div class="kpis"><div><b>${d.days_done}</b><span>ימי עבודה שבוצעו</span></div><div><b>${d.progress != null ? d.progress + '%' : (d.status === 'הושלם' ? '100%' : '—')}</b><span>התקדמות</span></div><div><b>${d.photos.length}</b><span>תמונות</span></div></div>
        ${d.progress != null ? `<div class="bar"><i style="width:${d.progress}%"></i></div>` : ''}
        ${d.first ? `<p style="margin-top:12px;color:#4A515B">העבודה החלה ב-${fd(d.first)}${d.last && d.last !== d.first ? ` · יום עבודה אחרון: ${fd(d.last)}` : ''}</p>` : ''}</div>
      ${d.upcoming.length ? `<div class="card"><h2>ימי העבודה הבאים</h2><div class="up">${d.upcoming.map(x => `<span>${fd(x)}</span>`).join('')}</div></div>` : ''}
      ${d.photos.length ? `<div class="card"><h2>מהשטח</h2><div class="gal">${d.photos.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div></div>` : ''}
      <div class="foot">עודכן ${new Date(d.updated).toLocaleString('he-IL', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' })} · E-Drone Technologies</div>
    </main>`;
  document.querySelectorAll('.gal img').forEach(i => i.onclick = () => { const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img src="${i.src}">`; z.onclick = () => z.remove(); document.body.appendChild(z); });
}).catch(() => { document.getElementById('app').innerHTML = '<div class="err">אין חיבור. נסו שוב.</div>'; });
</script>
</body>
</html>
